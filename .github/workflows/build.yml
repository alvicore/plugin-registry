name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'
      - '*.png'
      - '*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3   # -f: alla prima build non esiste nulla da rimuovere

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Access Secrets
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          ILCORSAROVIOLAVERCEL: ${{ secrets.ILCORSAROVIOLAVERCEL }}
        run: |
          cd $GITHUB_WORKSPACE/src
          echo TMDB_API=$TMDB_API >> secrets.properties
          echo SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID >> secrets.properties
          echo ILCORSAROVIOLAVERCEL=$ILCORSAROVIOLAVERCEL >> secrets.properties

      # JitPack serve metadata corrotto per com.github.recloudstream:gradle:master-SNAPSHOT
      # (dichiara la versione "master-aster-SNAPSHOT" e Gradle la rifiuta). Compiliamo il
      # plugin gradle dal sorgente e lo pubblichiamo in ~/.m2, come si fa in locale.
      - name: Build CloudStream gradle plugin from source
        run: |
          git clone --depth 1 https://github.com/recloudstream/gradle.git $GITHUB_WORKSPACE/cs-gradle
          cd $GITHUB_WORKSPACE/cs-gradle
          chmod +x gradlew
          ./gradlew publishToMavenLocal -Pversion=local

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          export BUILD_COMPLETED_AT_ROME="$(TZ=Europe/Rome date +"%d/%m/%Y %H:%M")"
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
